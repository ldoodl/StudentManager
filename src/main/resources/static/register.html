<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 学生管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .register-card h3 { color: #333; font-weight: 600; }
        .btn-success { background: #48bb78; border: none; }
        .btn-success:hover { background: #38a169; }
    </style>
</head>
<body>
<div class="register-card">
    <h3 class="text-center mb-4">📝 注册新账号</h3>
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" id="regUsername" class="form-control" placeholder="请输入用户名">
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" id="regPassword" class="form-control" placeholder="请输入密码（至少6位）">
        </div>
        <div class="mb-3">
            <label class="form-label">确认密码</label>
            <input type="password" id="regConfirm" class="form-control" placeholder="再次输入密码">
        </div>
        <button type="button" class="btn btn-success w-100" onclick="register()">注 册</button>
    </form>
    <div class="mt-3 text-center">
        <a href="login.html">已有账号？去登录</a>
    </div>
    <div id="regMsg" class="mt-2 text-danger text-center"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    async function register() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const confirm = document.getElementById('regConfirm').value.trim();
        const msg = document.getElementById('regMsg');

        if (!username || !password || !confirm) {
            msg.innerText = '请完整填写所有字段';
            return;
        }
        if (password.length < 6) {
            msg.innerText = '密码至少6位';
            return;
        }
        if (password !== confirm) {
            msg.innerText = '两次密码不一致';
            return;
        }

        try {
            const resp = await axios.post('/api/auth/register', {
                username,
                password,
                role: 'USER'
            });
            const result = resp.data;
            if (result.code === 200) {
                msg.style.color = 'green';
                msg.innerText = '✅ 注册成功！请去登录';
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                msg.style.color = 'red';
                msg.innerText = '注册失败：' + result.message;
            }
        } catch (error) {
            console.error(error);
            msg.innerText = '网络异常，请检查后端服务';
        }
    }

    // 按回车键触发注册
    document.getElementById('registerForm').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            register();
        }
    });
</script>
</body>
</html>
