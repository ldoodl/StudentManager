<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学生管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-card h3 { color: #333; font-weight: 600; }
        .btn-primary { background: #667eea; border: none; }
        .btn-primary:hover { background: #5a67d8; }
    </style>
</head>
<body>
<div class="login-card">
    <h3 class="text-center mb-4">🎓 学生管理系统</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" id="loginUsername" class="form-control" placeholder="请输入用户名">
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="请输入密码">
        </div>
        <button type="button" class="btn btn-primary w-100" onclick="login()">登 录</button>
    </form>
    <div class="mt-3 text-center">
        <a href="register.html">还没有账号？去注册</a>
    </div>
    <div id="loginMsg" class="mt-2 text-danger text-center"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    async function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const msg = document.getElementById('loginMsg');

        if (!username || !password) {
            msg.innerText = '请输入用户名和密码';
            return;
        }

        try {
            const resp = await axios.post('/api/auth/login', { username, password });
            const result = resp.data;
            if (result.code === 200) {
                const token = result.data;
                localStorage.setItem('jwtToken', token);
                msg.innerText = '';
                // 跳转到主页面
                window.location.href = '/index.html';
            } else {
                msg.innerText = '登录失败：' + result.message;
            }
        } catch (error) {
            console.error(error);
            msg.innerText = '网络异常，请检查后端服务';
        }
    }

    // 按回车触发登录
    document.getElementById('loginForm').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            login();
        }
    });
</script>
</body>
</html>
