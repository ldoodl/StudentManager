spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}               # 从环境变量读取
    username: ${DB_USERNAME}     # 从环境变量读取
    password: ${DB_PASSWORD}     # 从环境变量读取

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.studentmanagementweb: warn   # 生产环境只打印警告及以上级别的日志