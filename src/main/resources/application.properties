# 服务端口号（默认8080，可以不配置）
server.port=8080

# 数据库连接配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=000000

# MyBatis 配置（开启驼峰命名自动映射，让数据库字段 user_name 自动映射到 Java 属性 userName）
mybatis.configuration.map-underscore-to-camel-case=true